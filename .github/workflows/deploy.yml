name: Deploy site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    uses: ./.github/workflows/unit-tests.yml
  build:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: npm run lint:prettier && npm run lint:style-contract
      - name: Check build dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Audit Ruby, runtime gems and installed Python dependencies
        run: bash bin/audit-dependencies
      - run: node --test test/wait-for-live-cv.test.js
      - name: Build production site
        id: production
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build && npx purgecss -c purgecss.config.js
      - name: Identify this exact generated release
        run: node -e "require('node:fs').writeFileSync('_site/site-version.json', JSON.stringify({commit:process.env.GITHUB_SHA}))"
      - run: npx playwright install --with-deps chromium webkit
      - name: Accessibility, responsive layout, links and CV checks
        env:
          CHECK_SCREENSHOTS: "1"
        run: npm run test:visual
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.production.outcome == 'success'
        with:
          name: website
          path: _site/
          include-hidden-files: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-checks
          path: output/playwright/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dependency-audit
          path: |
            output/ci/dependency-audit/*.json
            output/ci/dependency-audit/*.txt
            output/ci/dependency-audit/Gemfile.runtime.lock
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: website
          path: _site
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
