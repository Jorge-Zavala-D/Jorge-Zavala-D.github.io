name: Integration tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [comments, plugin_toggles, distill, bootstrap_compat, upgrade_cli, css_minify]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: bash test/integration_${{ matrix.test }}.sh
