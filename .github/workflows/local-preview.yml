name: Container preview smoke test
on:
  push:
    branches: [main]
    paths:
      [
        Dockerfile,
        docker-compose.yml,
        bin/entry_point.sh,
        Gemfile,
        Gemfile.lock,
        package.json,
        package-lock.json,
        requirements.txt,
        bin/audit-dependencies,
        ".github/workflows/local-preview.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        Dockerfile,
        docker-compose.yml,
        bin/entry_point.sh,
        Gemfile,
        Gemfile.lock,
        package.json,
        package-lock.json,
        requirements.txt,
        bin/audit-dependencies,
        ".github/workflows/local-preview.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose up -d --build
      - name: Audit the actual container Ruby and Python environment
        run: docker compose exec -T jekyll bash bin/audit-dependencies
      - name: Verify root, CV and unchanged lockfile
        run: |
          curl --retry 40 --retry-delay 5 --retry-all-errors -fsS http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/cv/ > /dev/null
          curl -fsS http://127.0.0.1:8080/assets/pdf/Jorge_Zavala_CV.pdf > /dev/null
          git diff --exit-code -- Gemfile.lock
      - run: docker compose logs --tail=100
        if: always()
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: container-dependency-audit
          path: |
            output/ci/dependency-audit/*.json
            output/ci/dependency-audit/*.txt
            output/ci/dependency-audit/Gemfile.runtime.lock
      - run: docker compose down
        if: always()
