name: Locked website build environment
description: Install the pinned website build and test dependencies.
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1, 2026-10-10
      with:
        ruby-version: "3.3.12"
        bundler-cache: true
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
        cache: npm
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13"
        cache: pip
    - run: npm ci
      shell: bash
    - run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r requirements.txt
      shell: bash
    - run: sudo apt-get update && sudo apt-get install -y imagemagick
      shell: bash
