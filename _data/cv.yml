    Current Research Projects:
      - name: Breaking Cycles of Violence
        summary: Cumulative dissertation on the intergenerational legacies of violence and the material and informational pathways through which transitional justice can generate recognition, legitimacy, and durable repair.
        highlights:
          - Historical conflict exposure and the intergenerational transmission of violence in Peru.
          - Collective reparations, migration, and policy feedback in post-conflict Peru.
          - A cluster-randomized saturation pilot on transitional-justice information in Ayacucho and San Martín.
        start_date: 2025
        end_date: present

      - name: Evaluating CBT Group Interventions in Conflict-Affected Nigerian Communities
        summary: Two-wave randomized evaluation across 24 communities in Kaduna, Plateau, and Taraba.
        highlights:
          - "Coauthors: Nora Chirikure, Macartan Humphreys, Madalena Kresimon, and Alexandra Scacco."
          - "Outcomes: psychological recovery, functioning, agency, social connection, and verified community participation."
        start_date: 2026
        end_date: present

      - name: Digital Bridges for Financial Inclusion
        summary: Mixed-methods research on digital public infrastructure, remittances, fraud, financial autonomy, and Venezuelan migrant women in Colombia.
        highlights:
          - "Coauthor: Angélica Cardozo."
          - Combines surveys, latent class analysis, interviews, focus groups, institutional interviews, and regional benchmarking.
        start_date: 2025
        end_date: present

      - name: Coaching the Match
        summary: Three-arm randomized evaluation of WhatsApp micro-learning and AI-enabled business tools for informal service providers using the Biscate platform in Mozambique.
        highlights:
          - "Coauthor: Carla Srebot."
          - "Planned sample: 1,200 active workers."
        start_date: 2025
        end_date: present

